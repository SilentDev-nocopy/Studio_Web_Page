
# Build updates.json and deploy GitHub Pages
name: Build updates.json + Deploy Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *" # Every hour

  push:
    branches:
      - main

# Permissions required for updating the repository and deploying Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping deployments
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Generate updates.json
      - name: Build updates.json
        env:
          OWNER: SilentTearsDev
          REPOS: '["Studio_Web_Page","Python","NEXA"]'
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

        run: |
          python3 - << 'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          owner = os.environ["OWNER"]
          repos = json.loads(os.environ["REPOS"])
          token = os.environ.get("GH_TOKEN", "")

          def get(url):
              req = urllib.request.Request(url)
              req.add_header(
                  "Accept",
                  "application/vnd.github+json"
              )

              if token:
                  req.add_header(
                      "Authorization",
                      f"Bearer {token}"
                  )

              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      ), response.status

              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  return {
                      "_error": True,
                      "status": error.code,
                      "body": body
                  }, error.code

          updates = []
          errors = []

          for repo in repos:
              url = (
                  f"https://api.github.com/repos/"
                  f"{owner}/{repo}/commits?per_page=1"
              )

              data, status = get(url)

              if isinstance(data, dict) and data.get("_error"):
                  errors.append({
                      "repo": repo,
                      "status": status,
                      "detail": data.get("body", "")[:300]
                  })

                  print(f"[FAIL] {repo} -> HTTP {status}")
                  continue

              if not isinstance(data, list) or not data:
                  print(f"[SKIP] {repo} -> no commits returned")
                  continue

              commit = data[0]

              message = (
                  commit["commit"]["message"].splitlines()[0]
              )

              date = (
                  commit["commit"]["author"]["date"][:10]
              )

              html = commit["html_url"]

              updates.append({
                  "repo": repo,
                  "date": date,
                  "title": message,
                  "url": html
              })

              print(f"[OK] {repo} -> {date} -> {message}")

          updates.sort(
              key=lambda item: item["date"],
              reverse=True
          )

          output = {
              "owner": owner,
              "generated": True,
              "updates": updates,
              "errors": errors
          }

          with open(
              "updates.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("---- SUMMARY ----")
          print("Updates:", len(updates))
          print("Errors:", len(errors))
          PY

      # 3. Commit updates.json if changed
      - name: Commit updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add updates.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update updates.json"
            git push origin HEAD:main
          fi

      # 4. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Upload website files
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 6. Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
